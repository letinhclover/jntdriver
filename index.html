<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Đang Bảo Trì</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Roboto:wght@500;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0d0e12;
  --card: #151820;
  --primary: #CC0000;
  --accent: #f39c12;
  --text: #f0f2f5;
  --subtext: #8e95a5;
  --border: #242834;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Roboto', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  overflow: hidden;
  touch-action: manipulation;
}

.maintenance-box {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 22px 16px 18px;
  text-align: center;
  box-shadow: 0 16px 45px rgba(0, 0, 0, 0.7);
  position: relative;
}

.maintenance-box::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 20px 20px 0 0;
}

/* BÁNH RĂNG XOAY */
.gear-icon {
  font-size: 38px;
  line-height: 1;
  display: inline-block;
  animation: spin 5s linear infinite;
  margin-bottom: 6px;
  user-select: none;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

h1 {
  font-size: 1.3em;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: #fff;
  margin-bottom: 3px;
}

.sub-note {
  font-size: 12.5px;
  color: var(--subtext);
  margin-bottom: 15px;
}

/* KHUNG TRÒ CHƠI FLAPPY CANVAS */
.game-wrapper {
  background: #090a0d;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 10px;
  position: relative;
}

.scoreboard {
  display: flex;
  justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
  padding: 0 4px;
  color: var(--accent);
}
.scoreboard span {
  color: #fff;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #0b0d13;
  border-radius: 8px;
  touch-action: none;
  cursor: pointer;
}

.game-hint {
  font-size: 11px;
  color: var(--subtext);
  margin-top: 8px;
  font-weight: 500;
}
</style>
</head>
<body>

<div class="maintenance-box">
  <!-- BÁNH RĂNG XOAY -->
  <div class="gear-icon">⚙️</div>

  <!-- TIÊU ĐỀ & GHI CHÚ NGẮN -->
  <h1>ĐANG BẢO TRÌ</h1>
  <div class="sub-note">Thêm link mới và tối ưu các tính năng</div>

  <!-- KHU VỰC FLAPPY TRUCK -->
  <div class="game-wrapper">
    <div class="scoreboard">
      <div>ĐIỂM: <span id="scoreText">0</span></div>
      <div>KỶ LỤC: <span id="highScoreText">0</span></div>
    </div>

    <canvas id="flappyCanvas" width="380" height="230"></canvas>

    <div class="game-hint" id="gameHintText">👉 Chạm nhịp tay liên tục để giữ thăng bằng</div>
  </div>
</div>

<script>
// ================= MINI-GAME: FLAPPY TRUCK (XE TẢI BAY) =================
const canvas = document.getElementById('flappyCanvas');
const ctx = canvas.getContext('2d');
const scoreText = document.getElementById('scoreText');
const highScoreText = document.getElementById('highScoreText');
const gameHintText = document.getElementById('gameHintText');

let highScore = parseInt(localStorage.getItem('flappy_truck_highscore')) || 0;
highScoreText.innerText = highScore;

let gameRunning = false;
let gameOver = false;
let score = 0;
let frameCount = 0;
let crashReason = "";

const crashMessages = [
  "Móp đầu cabin! 💥",
  "Rụng gương chiếu hậu! 🪞",
  "Toang thùng hàng rồi! 📦",
  "Bể đèn pha phía trước! 🚨",
  "Rớt mất cản trước! 🚗"
];

// HIỆU ỨNG HẠT KHÓI BÔ XE (EXHAUST SMOKE PARTICLES)
let smokeParticles = [];
function addSmoke(x, y) {
  for (let i = 0; i < 4; i++) {
    smokeParticles.push({
      x: x - 4,
      y: y + 8 + (Math.random() * 4 - 2),
      vx: -(Math.random() * 1.5 + 1.2),
      vy: (Math.random() - 0.5) * 1.2,
      radius: Math.random() * 3.5 + 2,
      alpha: 0.8
    });
  }
}

// ĐỐI TƯỢNG XE TẢI BAY (FLAPPY TRUCK)
const truck = {
  x: 60,
  y: 100,
  width: 38,
  height: 22,
  vy: 0,
  gravity: 0.35,
  lift: -6.2,

  flap() {
    this.vy = this.lift;
    addSmoke(this.x, this.y);
  },

  update() {
    this.vy += this.gravity;
    this.y += this.vy;

    // Giới hạn nóc & sàn
    if (this.y < 0) {
      this.y = 0;
      this.vy = 0;
    }
  },

  draw() {
    ctx.save();
    ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

    // Tính góc nghiêng cabin theo vận tốc rơi
    let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.vy * 0.08));
    ctx.rotate(angle);

    let ox = -this.width / 2;
    let oy = -this.height / 2;

    // Thùng xe (Trắng)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(ox, oy + 2, 24, 16);

    // Dải đỏ thương hiệu J&T
    ctx.fillStyle = '#CC0000';
    ctx.fillRect(ox, oy + 8, 24, 4);

    // Đầu cabin (Đỏ)
    ctx.beginPath();
    ctx.moveTo(ox + 24, oy + 5);
    ctx.lineTo(ox + 33, oy + 5);
    ctx.lineTo(ox + 38, oy + 10);
    ctx.lineTo(ox + 38, oy + 18);
    ctx.lineTo(ox + 24, oy + 18);
    ctx.closePath();
    ctx.fill();

    // Kính chắn gió
    ctx.fillStyle = '#66b2ff';
    ctx.fillRect(ox + 30, oy + 7, 5, 5);

    // Đèn pha
    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(ox + 37, oy + 13, 2, 3);

    // 2 Bánh xe
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(ox + 8, oy + 19, 3.5, 0, Math.PI * 2);
    ctx.arc(ox + 31, oy + 19, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
};

// CỘT KIỆN HÀNG TỔNG KHO (PIPES)
let pipes = [];
const pipeWidth = 42;
const pipeGap = 84; // Độ hở khe (Thử thách & ức chế vừa đủ)
const pipeSpeed = 2.4;

class Pipe {
  constructor() {
    this.x = canvas.width;
    // Chiều cao ngẫu nhiên của cột trên
    this.topHeight = Math.floor(Math.random() * (canvas.height - pipeGap - 60)) + 30;
    this.bottomY = this.topHeight + pipeGap;
    this.passed = false;
  }

  update() {
    this.x -= pipeSpeed;
  }

  draw() {
    // Vẽ cột trên (Thùng hàng xếp chồng từ trên trần xuống)
    this.drawBoxTower(this.x, 0, pipeWidth, this.topHeight, true);

    // Vẽ cột dưới (Thùng hàng xếp chồng từ sàn lên)
    this.drawBoxTower(this.x, this.bottomY, pipeWidth, canvas.height - this.bottomY, false);
  }

  drawBoxTower(x, y, w, h, isTop) {
    ctx.fillStyle = '#222736';
    ctx.fillRect(x, y, w, h);

    // Viền sọc cảnh báo màu vàng/đen (Hazard warning)
    ctx.fillStyle = '#f39c12';
    let capY = isTop ? y + h - 10 : y;
    ctx.fillRect(x - 2, capY, w + 4, 10);

    ctx.fillStyle = '#111';
    for (let i = 0; i < w + 4; i += 8) {
      ctx.fillRect(x - 2 + i, capY, 4, 10);
    }

    ctx.strokeStyle = '#394154';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, y, w, h);
  }
}

// XỬ LÝ ĐIỀU KHIỂN CHẠM / PHÍM
function handleTap(e) {
  if (e) e.preventDefault();

  if (!gameRunning || gameOver) {
    resetGame();
    return;
  }

  truck.flap();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    handleTap(e);
  }
});

canvas.addEventListener('touchstart', handleTap, { passive: false });
canvas.addEventListener('mousedown', handleTap);

function resetGame() {
  pipes = [];
  smokeParticles = [];
  score = 0;
  frameCount = 0;
  gameOver = false;
  gameRunning = true;
  truck.y = 100;
  truck.vy = 0;
  scoreText.innerText = '0';
  gameHintText.innerText = "💨 Giữ nhịp tay đều đặn để lách khe!";
  loop();
}

// VÒNG LẶP CHÍNH (GAME LOOP)
function loop() {
  if (!gameRunning) return;

  frameCount++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Sinh cột chướng ngại vật định kỳ
  if (frameCount % 85 === 0) {
    pipes.push(new Pipe());
  }

  // 2. Cập nhật & vẽ cột hàng
  for (let i = pipes.length - 1; i >= 0; i--) {
    let p = pipes[i];
    p.update();
    p.draw();

    // Tính điểm khi xe bay qua an toàn
    if (!p.passed && p.x + pipeWidth < truck.x) {
      p.passed = true;
      score++;
      scoreText.innerText = score;
    }

    // KIỂM TRA VA CHẠM (HITBOX BO NHẸ CHỐNG BẤT CÔNG)
    let pad = 3;
    let hitX = truck.x + pad < p.x + pipeWidth && truck.x + truck.width - pad > p.x;
    let hitTop = truck.y + pad < p.topHeight;
    let hitBottom = truck.y + truck.height - pad > p.bottomY;

    if (hitX && (hitTop || hitBottom)) {
      triggerGameOver();
      return;
    }

    // Xóa cột đã đi khuất
    if (p.x + pipeWidth < 0) {
      pipes.splice(i, 1);
    }
  }

  // 3. Rơi xuống đáy sàn
  if (truck.y + truck.height >= canvas.height - 5) {
    triggerGameOver();
    return;
  }

  // 4. Cập nhật & vẽ hạt khói bô
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    let sp = smokeParticles[i];
    sp.x += sp.vx;
    sp.y += sp.vy;
    sp.alpha -= 0.025;

    if (sp.alpha <= 0) {
      smokeParticles.splice(i, 1);
      continue;
    }

    ctx.fillStyle = `rgba(180, 190, 205, ${sp.alpha})`;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sp.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // 5. Cập nhật & vẽ xe tải
  truck.update();
  truck.draw();

  requestAnimationFrame(loop);
}

// KHI BỊ TOANG
function triggerGameOver() {
  gameOver = true;
  gameRunning = false;
  crashReason = crashMessages[Math.floor(Math.random() * crashMessages.length)];

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('flappy_truck_highscore', highScore);
    highScoreText.innerText = highScore;
  }

  // Màn hình mờ kết thúc
  ctx.fillStyle = 'rgba(10, 12, 16, 0.78)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ff4d4d';
  ctx.font = '800 16px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(crashReason, canvas.width / 2, 90);

  ctx.fillStyle = '#f39c12';
  ctx.font = '700 13px "JetBrains Mono", monospace';
  ctx.fillText(`ĐIỂM ĐẠT ĐƯỢC: ${score}`, canvas.width / 2, 118);

  ctx.fillStyle = '#fff';
  ctx.font = '600 12px Roboto, sans-serif';
  ctx.fillText('Chạm vào màn hình để bay lại 🔄', canvas.width / 2, 150);
  ctx.textAlign = 'left';

  gameHintText.innerText = "👉 Chạm bất kỳ đâu để thử lại!";
}

// MÀN HÌNH CHỜ BAN ĐẦU
function showStartScreen() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  truck.y = 105;
  truck.draw();

  ctx.fillStyle = '#f39c12';
  ctx.font = '700 14px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('CHẠM ĐỂ BẮT ĐẦU BAY', canvas.width / 2, 75);

  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '500 11.5px Roboto, sans-serif';
  ctx.fillText('Né các tháp hàng tổng kho', canvas.width / 2, 155);
  ctx.textAlign = 'left';
}

showStartScreen();
</script>
</body>
</html>
